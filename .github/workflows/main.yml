name: Main (test, releases)
on:
  # # Indicates I want to run this workflow on all branches, PR, and tags
  push:
    branches: ["master"]
    tags: ["*"]
  pull_request:
    branches: [ "*" ]

jobs:
  lint:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        command:
        - make vet
        - make fmtcheck
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
      - name: Running ${{ matrix.command }}
        run: ${{ matrix.command }}

  prepare-dependencies:
    name: Prepare Dependencies
    runs-on: ubuntu-22.04
    outputs:
      test_matrix: ${{ steps.test-matrix.outputs.test_matrix }}
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Generate test matrix
        id: test-matrix
        run: |
          printf 'test_matrix=%s\n' "$(go run scripts/test-matrix.go --github-actions)" >> "$GITHUB_OUTPUT"

      - name: Download Terraform
        run: |
          mkdir -p bin
          curl -sfL https://releases.hashicorp.com/terraform/1.5.6/terraform_1.5.6_linux_amd64.zip > bin/terraform.zip
          cd bin && unzip terraform.zip && rm terraform.zip && chmod +x terraform

      - name: Vendor Go dependencies
        run: go mod vendor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache TiUP Playground Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.tiup-playground
          tags: terraform-provider-mysql-tiup-playground:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
          load: true

      - name: Save TiUP Playground Docker image
        run: |
          docker save terraform-provider-mysql-tiup-playground:latest | gzip > tiup-playground-image.tar.gz
          echo "Image saved: $(du -h tiup-playground-image.tar.gz | cut -f1)"

      # Note: Tests now use testcontainers - no mysql-client or Docker Buildx caching needed
      # Testcontainers handles container lifecycle and image pulling automatically
      # TiUP Playground image is pre-built above and saved as artifact for test jobs

      - name: Upload Terraform binary
        uses: actions/upload-artifact@v4
        with:
          name: terraform-binary
          path: bin/terraform
          retention-days: 1

      - name: Upload vendor directory
        uses: actions/upload-artifact@v4
        with:
          name: vendor-dir
          path: vendor/
          retention-days: 1
          compression-level: 6

      - name: Upload TiUP Playground Docker image
        uses: actions/upload-artifact@v4
        with:
          name: tiup-playground-image
          path: tiup-playground-image.tar.gz
          retention-days: 1
          compression-level: 6

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Run unit tests via Makefile
        run: make test-unit

  matrix-version-policy:
    name: Matrix Version Policy
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Check matrix versions
        id: matrix-policy
        env:
          MATRIX_POLICY_SUMMARY_FILE: ${{ runner.temp }}/matrix-version-policy.md
        run: |
          set +e
          rm -f "$MATRIX_POLICY_SUMMARY_FILE"
          make eol-versions-ci
          status=$?
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'summary_file=%s\n' "$MATRIX_POLICY_SUMMARY_FILE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Update matrix policy PR comment
        id: matrix-policy-comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          MATRIX_POLICY_SUMMARY_FILE: ${{ steps.matrix-policy.outputs.summary_file }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-provider-mysql:matrix-version-policy -->';
            const summaryFile = process.env.MATRIX_POLICY_SUMMARY_FILE;

            if (!summaryFile || !fs.existsSync(summaryFile)) {
              core.warning('Matrix policy summary file was not written; skipping PR comment.');
              return;
            }

            const summary = fs.readFileSync(summaryFile, 'utf8').trim();
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (summary.includes('All matrix versions are current and supported.')) {
              if (previous) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: previous.id });
              }
              return;
            }

            const body = `${marker}\n${summary}\n\n_This comment is updated automatically by the Matrix Version Policy workflow._`;
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail matrix version policy
        if: steps.matrix-policy.outputs.exit_code != '0'
        uses: actions/github-script@v7
        env:
          MATRIX_POLICY_EXIT_CODE: ${{ steps.matrix-policy.outputs.exit_code }}
          MATRIX_POLICY_COMMENT_OUTCOME: ${{ steps.matrix-policy-comment.outcome }}
        with:
          script: |
            const exitCode = Number(process.env.MATRIX_POLICY_EXIT_CODE || '1') || 1;
            const commentOutcome = process.env.MATRIX_POLICY_COMMENT_OUTCOME || 'skipped';
            const destination = context.eventName === 'pull_request' && commentOutcome === 'success'
              ? 'See the sticky Matrix Version Policy PR comment and this job summary for the full table.'
              : 'See this job summary for the full table.';
            const commentNote = context.eventName === 'pull_request' && commentOutcome !== 'success'
              ? ` PR comment was not written; comment step outcome: ${commentOutcome}.`
              : '';
            core.setFailed(`Matrix version policy failed because the version table contains red rows. ${destination}${commentNote}`);
            process.exitCode = exitCode;

  tests:
    name: Acceptance Matrix
    runs-on: ubuntu-22.04
    needs: [prepare-dependencies, unit-tests]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-dependencies.outputs.test_matrix) }}
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Download Terraform binary
        uses: actions/download-artifact@v4
        with:
          name: terraform-binary
          path: bin/

      - name: Download vendor directory
        uses: actions/download-artifact@v4
        with:
          name: vendor-dir
          path: vendor/

      - name: Make Terraform executable
        run: chmod +x bin/terraform

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download TiUP Playground Docker image
        uses: actions/download-artifact@v4
        with:
          name: tiup-playground-image
          path: ./

      - name: Load TiUP Playground Docker image
        run: |
          echo "Loading pre-built TiUP Playground Docker image..."
          gunzip -c tiup-playground-image.tar.gz | docker load
          docker images | grep terraform-provider-mysql-tiup-playground
          echo "✓ TiUP Playground image loaded successfully"

      # Note: TiUP Playground image is pre-built in prepare-dependencies and loaded here
      # This avoids rebuilding the image during each test run
      # Testcontainers handles container lifecycle and image pulling automatically

      - name: Run testcontainers tests via Makefile
        env:
          GOFLAGS: -mod=vendor
          TF_ACC: 1
        run: |
          export PATH="${{ github.workspace }}/bin:$PATH"
          echo "Running ${{ matrix.db_type }} ${{ matrix.db_version }} tests"
          make testcontainers-db DB="${{ matrix.db_type }}" VERSION="${{ matrix.db_version }}"

  release:
    name: 'Terraform Provider Release'
    needs: [tests, matrix-version-policy]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: hashicorp/ghaction-terraform-provider-release/.github/workflows/community.yml@v5
    secrets:
      gpg-private-key: '${{ secrets.GPG_PRIVATE_KEY }}'
    with:
      setup-go-version-file: 'go.mod'
