name: Main (test, releases)
on:
  # # Indicates I want to run this workflow on all branches, PR, and tags
  push:
    branches: ["master"]
    tags: ["*"]
  pull_request:
    branches: [ "*" ]
jobs:
  lint:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        command:
        - make vet
        - make fmtcheck
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
      - name: Running ${{ matrix.command }}
        run: ${{ matrix.command }}

  prepare-dependencies:
    name: Prepare Dependencies
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      
      - name: Download Terraform
        run: |
          mkdir -p bin
          curl -sfL https://releases.hashicorp.com/terraform/1.5.6/terraform_1.5.6_linux_amd64.zip > bin/terraform.zip
          cd bin && unzip terraform.zip && rm terraform.zip && chmod +x terraform
      
      - name: Vendor Go dependencies
        run: go mod vendor
      
      - name: Cache TiUP components
        uses: actions/cache@v4
        with:
          path: |
            ~/.tiup
          key: ${{ runner.os }}-tiup-components
          restore-keys: |
            ${{ runner.os }}-tiup-
      
      - name: Install TiUP
        run: |
          if ! command -v tiup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
          fi
          echo "$HOME/.tiup/bin" >> $GITHUB_PATH
      
      - name: Pre-download TiDB versions
        run: |
          export PATH=$HOME/.tiup/bin:$PATH
          # Pre-download TiDB versions used in tests (only if not already cached)
          tiup install tidb:v6.1.0 || true
          tiup install tidb:v6.5.3 || true
          tiup install tidb:v7.1.5 || true
          tiup install tidb:v7.5.2 || true
          tiup install tidb:v8.1.0 || true
          # Also install PD and TiKV components
          tiup install pd:v6.1.0 || true
          tiup install pd:v6.5.3 || true
          tiup install pd:v7.1.5 || true
          tiup install pd:v7.5.2 || true
          tiup install pd:v8.1.0 || true
          tiup install tikv:v6.1.0 || true
          tiup install tikv:v6.5.3 || true
          tiup install tikv:v7.1.5 || true
          tiup install tikv:v7.5.2 || true
          tiup install tikv:v8.1.0 || true
      
      - name: Upload Terraform binary
        uses: actions/upload-artifact@v4
        with:
          name: terraform-binary
          path: bin/terraform
          retention-days: 1
      
      - name: Upload vendor directory
        uses: actions/upload-artifact@v4
        with:
          name: vendor-dir
          path: vendor/
          retention-days: 1
          compression-level: 6

  tests:
    runs-on: ubuntu-22.04
    needs: [prepare-dependencies]
    strategy:
      fail-fast: false
      matrix:
        target:
        - testversion5.6
        - testversion5.7
        - testversion8.0
        - testpercona5.7
        - testpercona8.0
        - testmariadb10.3
        - testmariadb10.8
        - testmariadb10.10
        # Track https://github.com/pingcap/tidb/tags
        - testtidb6.1.0
        - testtidb6.5.3
        # - testtidb6.5.10
        - testtidb7.1.5
        - testtidb7.5.2
        - testtidb8.1.0
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      
      - name: Download Terraform binary
        uses: actions/download-artifact@v4
        with:
          name: terraform-binary
          path: bin/
      
      - name: Download vendor directory
        uses: actions/download-artifact@v4
        with:
          name: vendor-dir
          path: vendor/
      
      - name: Make Terraform executable
        run: chmod +x bin/terraform
      
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('**/.github/workflows/main.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-
      
      - name: Install mysql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mysql-client
      
      - name: Cache TiUP components
        if: contains(matrix.target, 'tidb')
        uses: actions/cache@v4
        with:
          path: |
            ~/.tiup
          key: ${{ runner.os }}-tiup-components
          restore-keys: |
            ${{ runner.os }}-tiup-
      
      - name: Install TiUP (if not cached)
        if: contains(matrix.target, 'tidb')
        run: |
          if ! command -v tiup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
            echo "$HOME/.tiup/bin" >> $GITHUB_PATH
          else
            echo "$HOME/.tiup/bin" >> $GITHUB_PATH
          fi
      
      - name: Run tests {{ matrix.target }}
        env:
          GOFLAGS: -mod=vendor
        run: make ${{ matrix.target }}
